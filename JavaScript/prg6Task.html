<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <script type="text/javascript">
        function findres(){
            var m1=parseInt(document.getElementById("t1").value);
            var m2=parseInt(document.getElementById("t2").value);
            var m3=parseInt(document.getElementById("t3").value);
            var m4=parseInt(document.getElementById("t4").value);
            var m5=parseInt(document.getElementById("t5").value);
            var tot=m1+m2+m3+m4+m5;
            var per=tot/5.0;
            var res="";
            var grade="";
            if(m1>34 && m2>34 && m3>34  && m4>34 && m5>34){
                res="PASS";
                if(per>=90)
                grade="Outstanding";
                else if(per>=80)
                grade="Excellent";
                else if(per>=70)
                grade="Good"
                else if(per>=60)
                grade="Fair";
                else
                grade="Need to improve";
            }
            
            else{
                res="FAIL";
                grade="Idhukudha Padinga da Padinga da sonnen";
            }

            if(res=="PASS"){
                document.getElementById("r1").innerHTML="<font color='green'>Total : "+tot+"</font>";
                document.getElementById("r2").innerHTML="<font color='green'>Percentage : "+per+"%"+"</font>";
                document.getElementById("r3").innerHTML="<font color='green'>Result : "+res+"</font>";
                document.getElementById("r4").innerHTML="<font color='green'>Grade : "+grade+"</font>";
            }
            else{
                document.getElementById("r1").innerHTML="<font color='red'>Total : "+tot+"</font>";
                document.getElementById("r2").innerHTML="<font color='red'>Percentage : "+per+"%"+"</font>";
                document.getElementById("r3").innerHTML="<font color='red'>Result : "+res+"</font>";
                document.getElementById("r4").innerHTML="<font color='red'>Grade : "+grade+"</font>";
            }  
        }
    </script>  
</head>
<body>
    <input type="text" id="t1" placeholder="Enter Mark 1"><br>
    <input type="text" id="t2" placeholder="Enter Mark 2"><br>
    <input type="text" id="t3" placeholder="Enter Mark 3"><br>
    <input type="text" id="t4" placeholder="Enter Mark 4"><br>
    <input type="text" id="t5" placeholder="Enter Mark 5"><br>
    <input type="button" value="Result" onclick="findres()"><br>
    <div id="r1"></div>
    <div id="r2"></div>
    <div id="r3"></div>    
    <div id="r4"></div> 
</body>
</html>

<!-- Prompt is get the value from the user or runtime  -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function show(){
            var size=parseInt(document.getElementById("t1").value);
            var arr= new Array(size);
            for(var i=0;i<size;i++){
            arr[i]=prompt("enter a array value at index:"+i);
            }
            for(var i=0;i<size;i++)
            {
            document.write("<br> value"+ i+ "="+arr[i]);
        }

        }

    </script>
 </head>
 <body>
    <input type="text" id="t1" placeholder="Enter array Size">
    <br>
    <button onclick="show()">array elment </button>
 </body>
 </html>

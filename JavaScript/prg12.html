<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
function display(){
    var n1=parseInt( document.getElementById("t1").value);
        var n2=parseInt(document.getElementById("t2").value);
        var res="";
        for(let i=n1;i<=n2;i++){
            res=res+i+" ";
        }
        document.getElementById("ans").innerHTML=res;

}
    </script>
</head>
<body><h1><center>For loop</center></h1>
    <input type="text" id="t1" placeholder="enter a starting Number">
    <br>
        <input type="text" id="t2" placeholder="enter a ending Number">
        <br>
        <input type="button" value="show answer" onclick="display()">
        <div id="ans"></div>
</body>
</html>

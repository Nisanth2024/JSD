<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function findres(){
              var m1=parseInt(document.getElementById("t1").value);
        var num="";
        if((m1%4==0 && m1%100!=0)||(m1%400==0)){
            num="Leap Year";
            document.getElementById("r1").innerHTML="The given number "+m1+" is : "+num;
        } 
        else{
            num="Not Leap Year";
            document.getElementById("r1").innerHTML="The given number "+m1+" is : "+num;
        }
        } 
    </script>
</head>
<body>
     <input type="text" id="t1" placeholder="Enter Year"><br>
     <input type="button" value="Result" onclick="findres()"><br>
     <div id="r1"></div>      
</body>
</html>

    <script type="text/javascript">

            document.write("<br>");
        }*/
        //Sum Of Even In Array
        var size=parseInt(document.getElementById("t1").value);
        var arr=new Array(size)
        var esum=0;
        for(var i=0;i<size;i++){
            if(arr[i]%2===0){
                esum=esum+arr[i];
            }
            document.write("<br>Sum of Even numbers : "+esum);
        }

    </script>
</head>
<body>
    <input type="text" id="t1" placeholder="Enter a number">
</body>
</html>

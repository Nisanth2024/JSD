<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        var i=1;
        function showimages(){
            if(i==1)
            document.getElementById("myimg").src="./images/Salaar.jpg";
            if(i==2)
            document.getElementById("myimg").src="./images/Kalki.jpg";
            if(i==3)
            document.getElementById("myimg").src="./images/Baahubali.jpg";

            i++;
            if(i>=4)
            i=1;

            setTimeout(showimages,300)

        }
    </script>
</head>
<body onload="showimages()">
    <center>
        <img style="border: 10px ridge grey;" id="myimg" src="./images/Salaar.jpg" width="80%">
    </center>   
</body>
</html>

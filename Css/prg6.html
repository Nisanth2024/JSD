<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/CSS">
        #head1
        {
            color: red;
        }
        #head2{
            color: green;
        }
        #head3{
            color: blue;
        }
    </style>
</head>
<body>
    <h1>COndition :- Don't use inline CSS</h1>
    <h2>ID attributes :- we can apply different styles for same tag</h2>

    <h2 id="head1">This is Header 1 red color</h2>
    <h2 id="head2">This is Header 2 green color</h2>
    <h2 id="head3">This is Header blue color</h2>
    
</body>
</html>
